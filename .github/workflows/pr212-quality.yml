name: PR 212 Quality Gate

on:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    if: github.event.pull_request.number == 212
    runs-on: ubuntu-latest
    name: PR 212 validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare SQLite test environment
        run: |
          cp .env.example .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite" >> .env
          mkdir -p database
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan optimize:clear

      - name: Full PHP suite diagnostic
        run: |
          set -o pipefail
          php artisan test 2>&1 | tee php-suite.log

      - name: Upload PHP diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr212-php-suite-log
          path: php-suite.log

      - name: Feature tests
        if: always()
        run: php artisan test tests/Feature/HomeCategoryCarouselTest.php

      - name: Pint changed PHP files
        if: always()
        run: vendor/bin/pint --test tests/Feature/HomeCategoriesTest.php tests/Feature/HomeCategoryCarouselTest.php database/seeders/BrowserTestSeeder.php

      - name: Diff check
        if: always()
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
