name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP 8.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Force SQLite testing database
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite" >> .env

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Verify code style with Pint
        run: vendor/bin/pint --test

      - name: Clear Laravel caches
        run: php artisan optimize:clear

      - name: Execute tests
        run: php artisan test

  mariadb-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    name: MariaDB 11.4 production compatibility

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: kairus_test
          MARIADB_USER: kairus
          MARIADB_PASSWORD: kairus_test_password
          MARIADB_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kairus_test
      DB_USERNAME: kairus
      DB_PASSWORD: kairus_test_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, fileinfo, openssl, gd, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Clear Laravel caches
        run: php artisan optimize:clear

      - name: Verify MariaDB connection and server identity
        run: php artisan db:show --database=mariadb

      - name: Fresh migration on MariaDB
        run: php artisan migrate:fresh --force

      - name: Execute MariaDB compatibility regression pack
        run: >-
          php artisan test
          tests/Unit/ArticleSchedulingTest.php
          tests/Feature/Admin/ArticleSchedulingTest.php
          tests/Feature/Console/PublishScheduledArticlesTest.php
          tests/Feature/HttpsCanonicalizationTest.php
          tests/Unit/ArticleLinkSuggestionServiceTest.php
          tests/Feature/ArticleLinkSuggestionControllerTest.php
          tests/Feature/InternalLinkAuditCommandTest.php
          tests/Unit/InternalLinking/InternalLinkTemporalEligibilityTest.php
          tests/Unit/MediaWebpMigrationServiceTest.php
          tests/Unit/MediaWebpCleanupServiceTest.php
          tests/Feature/Admin/MediaMoveControllerTest.php
          tests/Feature/Admin/MediaUsageAndDeletionTest.php
          tests/Feature/Admin/AdminNavigationTest.php
          tests/Feature/AnalyticsHygieneTest.php
          tests/Feature/Admin/Communication/NewsletterModuleRegressionTest.php

  windows-media-safety:
    runs-on: windows-latest

    name: Windows media safety (PHP 8.4)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, fileinfo, openssl, gd, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          New-Item -ItemType Directory -Force database | Out-Null
          New-Item -ItemType File -Force database/database.sqlite | Out-Null
          Add-Content .env "DB_CONNECTION=sqlite"
          Add-Content .env "DB_DATABASE=${{ github.workspace }}/database/database.sqlite"
          Add-Content .env "CACHE_STORE=array"
          Add-Content .env "SESSION_DRIVER=array"
          Add-Content .env "QUEUE_CONNECTION=sync"

      - name: Generate app key
        run: php artisan key:generate

      - name: Clear Laravel caches
        run: php artisan optimize:clear

      - name: Execute Windows media safety block
        run: php artisan test tests/Unit/MediaWebpCleanupServiceTest.php tests/Unit/MediaWebpMigrationServiceTest.php tests/Feature/Console/ConvertMediaToWebpCommandTest.php tests/Feature/ImageWebpConversionTest.php tests/Feature/Uploads/CategoryProfileTuringMediaSyncTest.php tests/Feature/Uploads/MediaPublicSyncTest.php tests/Feature/PublicMediaSyncServiceTest.php