name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    runs-on: ubuntu-latest

    name: PHP 8.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, fileinfo, openssl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Force SQLite testing database
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite" >> .env

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Clear Laravel caches
        run: php artisan optimize:clear

      - name: Execute tests with diagnostics
        shell: bash
        run: |
          set +e
          vendor/bin/phpunit --log-junit storage/logs/phpunit-junit.xml
          status=$?
          if [ "$status" -ne 0 ]; then
            php -r '
              $path = "storage/logs/phpunit-junit.xml";
              if (!is_file($path)) { fwrite(STDERR, "::error::PHPUnit failed and JUnit output was not created\n"); exit(0); }
              $xml = simplexml_load_file($path);
              if ($xml === false) { fwrite(STDERR, "::error::Unable to parse PHPUnit JUnit output\n"); exit(0); }
              $nodes = $xml->xpath("//testcase[failure or error]") ?: [];
              foreach ($nodes as $case) {
                $failure = isset($case->failure) ? $case->failure : $case->error;
                $class = (string) $case["class"];
                $name = (string) $case["name"];
                $file = (string) $case["file"];
                $line = (string) $case["line"];
                $message = trim((string) $failure["message"] ?: (string) $failure);
                $message = str_replace(["\r", "\n"], ["", "%0A"], $message);
                $location = $file !== "" ? " file={$file}" : "";
                $linePart = $line !== "" ? ",line={$line}" : "";
                fwrite(STDERR, "::error{$location}{$linePart}::{$class}::{$name} — {$message}\n");
                fwrite(STDOUT, "FAILURE_SUMMARY {$class}::{$name} | {$file}:{$line} | {$message}\n");
              }
            '
          fi
          exit "$status"
