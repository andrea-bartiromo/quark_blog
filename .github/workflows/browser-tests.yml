name: Browser Tests

on:
  push:
    branches:
      - main
      - test/frontend-playwright-harness
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Chromium public regression
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'test(frontend): synchronize Playwright dependency lock'
          file_pattern: package-lock.json
