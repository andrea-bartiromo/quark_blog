# Gate dedicato al sottosistema Comunicazione/Newsletter (Kairus).
# Perché un workflow separato e non un'estensione di
# content-clusters-mariadb.yml: quel workflow è scoped tramite `paths:` ai
# soli file di Content Clusters e non si attiverebbe mai su queste
# modifiche — questo file segue la stessa convenzione per-feature.
#
# Nato per il solo ledger di consegna generico (CommunicationDelivery),
# esteso qui (Newsletter 2.0) a tutto ciò che il sottosistema ha
# acquisito da allora: state machine campagna/invio, rendering/preview,
# ricerca destinatari, provider fake, orchestrazione di invio,
# preflight, dry-run, disiscrizione pubblica — nome del file/job e
# `name:` in cima lasciati invariati per non rompere un eventuale
# branch protection già configurato su questo check, solo lo scope
# (`paths:` e lista Pint) è stato allargato. Nessun nuovo workflow
# creato: sarebbe stata una duplicazione, non un gate aggiuntivo utile.
name: Communication Delivery MariaDB

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'app/Models/Communication*.php'
      - 'app/Http/Controllers/Admin/Communication/**'
      - 'app/Http/Controllers/CommunicationUnsubscribeController.php'
      - 'app/Services/Communication/**'
      - 'app/Contracts/EmailDeliveryProvider.php'
      - 'app/Console/Commands/Communication*.php'
      - 'database/factories/Communication*.php'
      - 'database/migrations/*comm*'
      - 'database/migrations/*communication*'
      - 'resources/views/admin/communication/**'
      - 'resources/views/communication/**'
      - 'resources/views/emails/communication/**'
      - 'tests/Unit/Communication/**'
      - 'tests/Feature/Communication/**'
      - 'tests/Feature/Admin/Communication/**'
      - '.github/workflows/communication-delivery-mariadb.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mariadb-communication-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: kairus_test
          MARIADB_USER: kairus
          MARIADB_PASSWORD: kairus_test_password
          MARIADB_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: kairus_test
      DB_USERNAME: kairus
      DB_PASSWORD: kairus_test_password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, fileinfo, openssl, gd, exif
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Pint
        run: >-
          vendor/bin/pint --test
          app/Models/CommunicationDelivery.php
          app/Models/CommunicationSubscriber.php
          app/Models/CommunicationCampaign.php
          app/Models/CommunicationSend.php
          app/Models/CommunicationSenderProfile.php
          app/Http/Controllers/Admin/Communication
          app/Http/Controllers/CommunicationUnsubscribeController.php
          app/Services/Communication
          app/Contracts/EmailDeliveryProvider.php
          app/Console/Commands/CommunicationReviewStaleSends.php
          app/Http/Requests/Admin/StoreCommunicationCampaignRequest.php
          app/Http/Requests/Admin/UpdateCommunicationCampaignRequest.php
          app/Http/Requests/Admin/StoreCommunicationSenderProfileRequest.php
          app/Http/Requests/Admin/UpdateCommunicationSenderProfileRequest.php
          database/factories/CommunicationDeliveryFactory.php
          database/migrations/2026_08_15_111755_create_communication_deliveries_table.php
          tests/Unit/Communication
          tests/Feature/Communication
          tests/Feature/Admin/Communication
      - run: cp .env.example .env && php artisan key:generate && php artisan optimize:clear
      - name: Fresh MariaDB migration and idempotency/concurrency tests
        run: |
          php artisan db:show --database=mariadb
          php artisan migrate:fresh --force
          php artisan test tests/Unit/Communication tests/Feature/Communication tests/Feature/Admin/Communication
      - name: Incremental migration from a populated pre-existing schema
        run: |
          set -eu
          php artisan migrate:fresh --force
          # Targeted teardown of exactly this migration, regardless of how
          # many later migrations now exist on main (--path restricts what
          # rollback actually runs down() for; every other migration in the
          # same batch — and its migrations-table row — is left untouched,
          # so this stays correct no matter how far main's timeline moves).
          php artisan migrate:rollback --path=database/migrations/2026_08_15_111755_create_communication_deliveries_table.php --force
          php artisan tinker --execute="if (Illuminate\\Support\\Facades\\Schema::hasTable('communication_deliveries')) { throw new RuntimeException('communication_deliveries still present after targeted rollback'); }"
          php artisan tinker --execute="App\\Models\\CommunicationSubscriber::create(['email'=>'incremental@example.test','status'=>App\\Models\\CommunicationSubscriber::STATUS_CONFIRMED,'unsubscribe_token'=>bin2hex(random_bytes(16)),'confirmed_at'=>now()]);"
          php artisan migrate --force
          php artisan tinker --execute="\$s=App\\Models\\CommunicationSubscriber::where('email','incremental@example.test')->first(); if (!\$s || !Illuminate\\Support\\Facades\\Schema::hasTable('communication_deliveries')) { throw new RuntimeException('Incremental migration verification failed'); } \$d=app(App\\Services\\Communication\\CommunicationDeliveryService::class)->registerDelivery('email','incremental_probe',\$s,null,'ci-incremental-check'); if (!\$d->id) { throw new RuntimeException('New table not usable after incremental migration'); }"
